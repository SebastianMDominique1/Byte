services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bytebites
      POSTGRES_DB: bytebites
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run keys:generate first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bytebites_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytebites -d bytebites"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  bytebites_postgres:
